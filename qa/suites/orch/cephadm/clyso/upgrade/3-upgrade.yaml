tasks:
- workunit:
    cleanup: true
    no_coverage_and_limits: true #set this to true to avoid adjust-ulimits script since it isn't installed when only images are used
    clients:
        client.0:
            - test_upgrade_downgrade.sh
    env:
        BASE_IMAGE: *base_image
        TARGET_IMAGE: *target_image
        BASE_IMAGE_NAME: *base_image_name
        TARGET_IMAGE_NAME: *target_image_name
        
overrides:
  ceph:
    log-ignorelist:
      - CEPHADM_STRAY_DAEMON  
      - CEPHADM_FAILED_DAEMON
      - CEPHADM_AGENT_DOWN
      - CEPHADM_DAEMON_PLACE_FAIL
    log-only-match:
      - CEPHADM_
